server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames can be cached hard; index.html never can,
    # otherwise a deploy would keep serving the previous bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API calls go to the FastAPI container. The trailing slash on
    # proxy_pass strips the /api prefix the browser sent, matching the
    # backend's own /api/* routes via the rewrite below.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Single-page app: unknown paths fall back to index.html so a refresh
    # on a deep link still works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
